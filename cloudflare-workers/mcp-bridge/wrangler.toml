name = "axim-core-mcp"
main = "src/index.ts"
compatibility_date = "2026-07-09"
compatibility_flags = ["nodejs_compat"]

[vars]
ENVIRONMENT = "production"
PASSPORT_VERIFY_URL = "https://passport.axim.us.com/api/v1/auth/verify-token"
SUPABASE_URL = "https://pvbcdndqjguzqeafhwhw.supabase.co"
ALLOWED_ORIGINS = "https://axim.us.com,https://core.axim.us.com,http://localhost:5173"
RATE_LIMIT_PER_HOUR = "60"

# KV Namespace for emergency kill switch and sliding-window rate limiting
# Run 'npx wrangler kv:namespace create LAB_STATE' and insert the namespace id below:
[[kv_namespaces]]
binding = "LAB_STATE"
id = "YOUR_KV_NAMESPACE_ID"
